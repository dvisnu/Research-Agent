# Dev topics: real CS/ML questions and ideas for checking each phase by hand.
#
# Keep these separate from the Phase 7 benchmark topics, so nothing is tuned on
# the test set. `key_papers` are papers any reasonable search should find; Phase 1
# is done when its corpus contains them.
#
# input = "question" (a research question) or "idea" (a rough idea to develop).

[[topic]]
id = "rag-knowledge-conflicts"
input = "question"
area = "NLP"
text = "How can retrieval-augmented generation systems reduce hallucinations when the retrieved documents conflict with each other?"
key_papers = [
  { arxiv = "2005.11401", title = "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks" },
  { arxiv = "2305.13300", title = "Adaptive Chameleon or Stubborn Sloth: Revealing the Behavior of Large Language Models in Knowledge Conflicts" },
  { arxiv = "2403.08319", title = "Knowledge Conflicts for LLMs: A Survey" },
  { arxiv = "2310.11511", title = "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection" },
]

